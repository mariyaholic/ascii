name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: PWA (typecheck, tests, parity, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      # Fails if the browser engine no longer reproduces the Rust golden fixtures.
      - run: bun run parity
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: pwa-dist
          path: dist

  rust:
    name: Rust core, CLI and desktop app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  desktop-release:
    name: Desktop binaries (${{ matrix.os }})
    needs: rust
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo build --release -p phosphorgrid -p phosphorgrid-app
      - uses: actions/upload-artifact@v4
        with:
          name: phosphorgrid-${{ runner.os }}
          path: |
            desktop/target/release/phosphorgrid
            desktop/target/release/phosphorgrid-studio
            desktop/target/release/phosphorgrid.exe
            desktop/target/release/phosphorgrid-studio.exe
          if-no-files-found: error
